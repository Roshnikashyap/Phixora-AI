<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phixora AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
        linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
       url("{{ url_for('static', filename='images/DigitalSecurity.jpg') }}") no-repeat center center/cover;
    color:white;
    animation: fadeIn 1.5s ease-in-out;
}

.hero{
    max-width:700px;
    padding:50px 40px;
    text-align:center;

    background: rgba(0, 0, 0, 0.45);   /* transparency */
    backdrop-filter: blur(12px);      /* glass blur effect */
    -webkit-backdrop-filter: blur(12px); /* for Safari */

    border-radius:12px;
    border: 1px solid rgba(255,255,255,0.1);
}

.hero h1{
    font-size:48px;
    font-weight:600;
    margin-bottom:15px;
    opacity:0;
    transform:translateY(40px);
    animation: slideUp 1s ease forwards;
}

.hero h1:nth-child(1){
    animation-delay:0.5s;
}

.hero h1:nth-child(2){
    font-size:28px;
    font-weight:400;
    animation-delay:0.9s;
}

.hero p{
    font-size:18px;
    color:#dcdcdc;
    margin-bottom:40px;
    opacity:0;
    transform:translateY(40px);
    animation: slideUp 1s ease forwards;
    animation-delay:1.3s;
}

.hero-btn{
    background: linear-gradient(135deg, #2563eb, #1d4ed8);
    padding:14px 36px;
    border-radius:8px;
    text-decoration:none;
    color:white;
    font-weight:600;
    letter-spacing:0.5px;
    display:inline-block;
    transition: all 0.35s ease;
    box-shadow: 0 8px 20px rgba(37, 99, 235, 0.4);
}

/* Hover Effect */
.hero-btn:hover{
    transform: translateY(-5px) scale(1.05);
    box-shadow: 0 15px 30px rgba(37, 99, 235, 0.6);
    background: linear-gradient(135deg, #1d4ed8, #2563eb);
}

/* Animations */

@keyframes slideUp{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}
</style>
</head>

<body>

<div class="hero">
    <h1>PHIXORA AI</h1>
    <h1>Intelligent Phishing Detection</h1>
    <p>Advanced threat detection powered by intelligent security analytics.</p>
    <a href="/dashboard" class="hero-btn">Access Secure Console</a>
</div>

</body>
</html>
